name: macOS Build (Capacitor Electron DMG)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Verificar tipos (vue-tsc)
        run: npm run type-check

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit -- --run

      - name: Compilar frontend y sincronizar con Capacitor Electron
        run: npm run cap:electron:sync

      - name: Compilar paquete DMG con Electron Builder
        run: |
          cd electron
          npm run pack

      - name: Preparar carpeta de salida de artefactos
        run: |
          mkdir -p build-output-macos
          cp electron/dist/*.dmg build-output-macos/ 2>/dev/null || true

      - name: Subir artefactos a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: changarro-macos-dmg
          path: build-output-macos/

      - name: Crear GitHub Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output-macos/*
          draft: false
          prerelease: false
          generate_release_notes: true
