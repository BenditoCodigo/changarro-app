name: Android Build (Capacitor AAB & APK)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java 21 (Requerido por Capacitor 6+)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Verificar tipos (vue-tsc)
        run: npm run type-check

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit -- --run

      - name: Compilar frontend web y sincronizar con Capacitor
        run: npm run cap:sync

      - name: Asignar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar Android App Bundle (.aab) con Gradle
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Compilar APK Release (.apk) con Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Firmar AAB Release (Si existen secretos en GitHub)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: rstudio/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Firmar APK Release (Si existen secretos en GitHub)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: rstudio/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Organizar artefactos compilados
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/bundle/release/*.aab build-output/ || true
          cp android/app/build/outputs/apk/release/*.apk build-output/ || true

      - name: Subir artefactos a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: changarro-android-builds
          path: build-output/

      - name: Crear GitHub Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*
          draft: false
          prerelease: false
          generate_release_notes: true
