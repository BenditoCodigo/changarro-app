name: Android Build (Capacitor AAB & APK)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App Bundle & APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java 21 (Requerido por Capacitor 6+)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Verificar tipos (vue-tsc)
        run: npm run type-check

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit -- --run

      - name: Compilar frontend web y sincronizar con Capacitor
        run: npm run cap:sync

      - name: Asignar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar Android App Bundle (.aab) con Gradle
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Compilar APK Release (.apk) con Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Preparar carpeta de salida de artefactos
        run: mkdir -p build-output

      - name: Firmar artefactos AAB y APK (si existen secretos en GitHub)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          # 1. Decodificar el Keystore
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

          # 2. Firmar el archivo .aab usando jarsigner (Java JDK)
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "${{ env.KEYSTORE_PASSWORD }}" \
              -keypass "${{ env.KEY_PASSWORD }}" \
              "$AAB_PATH" \
              "${{ env.KEY_ALIAS }}"
            cp "$AAB_PATH" build-output/changarro-release.aab
          fi

          # 3. Firmar el archivo .apk usando apksigner (Android SDK)
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            $BUILD_TOOLS/zipalign -f 4 "$APK_PATH" build-output/changarro-aligned.apk
            $BUILD_TOOLS/apksigner sign \
              --ks release.keystore \
              --ks-pass "pass:${{ env.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ env.KEY_PASSWORD }}" \
              --ks-key-alias "${{ env.KEY_ALIAS }}" \
              --out build-output/changarro-release.apk \
              build-output/changarro-aligned.apk
            rm -f build-output/changarro-aligned.apk
          fi

          # 4. Eliminar el Keystore temporal por seguridad
          rm -f release.keystore

      - name: Copiar paquetes sin firmar (fallback si no hay secretos)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          cp android/app/build/outputs/bundle/release/*.aab build-output/ || true
          cp android/app/build/outputs/apk/release/*.apk build-output/ || true

      - name: Subir artefactos a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: changarro-android-builds
          path: build-output/

      - name: Crear GitHub Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*
          draft: false
          prerelease: false
          generate_release_notes: true
