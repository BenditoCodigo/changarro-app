name: Code Quality (PR & Tags)

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality-check:
    name: Lint, Type Check & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Linter (Oxlint & ESLint)
        run: npm run lint

      - name: Verificación de tipos (vue-tsc)
        run: npm run type-check

      - name: Pruebas unitarias (Vitest)
        run: npm run test:unit -- --run

      - name: Validar compilación del frontend (Vite build)
        run: npm run build
